name: Template Labels

on:
  pull_request_target:
    branches:
      - master
    types: [opened, edited, synchronize, reopened]

jobs:
  label-templates:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      # The PR's code is only read as data. The scripts that run with the
      # write token come from the base branch, so a PR can't change them.
      - name: Check out PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Check out scripts from base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Get changed template JSON files
        id: changed-templates
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          path: pr
          files: '*.json'
          files_ignore: '.github/**'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check template properties and compute labels
        id: template-labels
        env:
          TEMPLATE_FILES: ${{ steps.changed-templates.outputs.all_changed_files }}
          LABELS_ADD_FILE: /tmp/template_labels_add.txt
          LABELS_REMOVE_FILE: /tmp/template_labels_remove.txt
        working-directory: pr
        run: |
          python ../base/.github/scripts/check_template_labels.py

      - name: Add labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels_file="/tmp/template_labels_add.txt"
          if [ ! -f "$labels_file" ] || [ ! -s "$labels_file" ]; then
            echo "No labels to add."
            exit 0
          fi
          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            echo "Adding label: $label"
            gh pr edit "$pr_number" --repo "$repo" --add-label "$label"
          done < "$labels_file"

      - name: Remove labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels_file="/tmp/template_labels_remove.txt"
          if [ ! -f "$labels_file" ] || [ ! -s "$labels_file" ]; then
            echo "No labels to remove."
            exit 0
          fi
          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            echo "Removing label: $label"
            gh pr edit "$pr_number" --repo "$repo" --remove-label "$label" 2>/dev/null || true
          done < "$labels_file"
