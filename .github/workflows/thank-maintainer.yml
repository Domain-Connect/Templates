name: Thank Maintainer

# Thanks a maintainer (as listed in .github/FUNDING.yml) after they merge a PR,
# and reminds contributors/companies that the review process is maintained by
# independent individuals in their spare time.

on:
  pull_request_target:
    types: [closed]
    paths:
      - '*.json'

jobs:
  thank-maintainer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check if merger is a listed sponsor and get link
        id: funding
        env:
          MERGER: ${{ github.event.pull_request.merged_by.login }}
        run: |
          mapfile -t maintainers < <(yq -r '.github[]' .github/FUNDING.yml)
          is_sponsor=false
          for maintainer in "${maintainers[@]}"; do
            if [ "$maintainer" = "$MERGER" ]; then
              is_sponsor=true
              break
            fi
          done
          echo "is_sponsor=$is_sponsor" >> "$GITHUB_OUTPUT"

      - name: Thank maintainer
        env:
          IS_SPONSOR: ${{ steps.funding.outputs.is_sponsor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
          SUBMITTER: ${{ github.event.pull_request.user.login }}
        run: |
          {
            echo "Thanks @${SUBMITTER} for contributing the template. 🎉"
            echo
            echo "This template has been reviewed and merged by @${MERGER}. 🙌"
            echo
            if [ "$IS_SPONSOR" = "true" ]; then
              echo "This template repository and its review process are maintained by independent individuals in their spare time, not as part of a paid role. If you or your company benefit from this protocol and its tools, please show your appreciation by buying a beer for @${MERGER}: https://github.com/sponsors/${MERGER}"
              echo
            fi
            echo "Note that DNS providers handle template onboarding differently: some pull changes from this repository automatically on a sync interval, others need to be contacted. Contact details: https://www.domainconnect.org/dns-providers/"
          } > body.txt
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file body.txt
